# HTTP-only ACME bootstrap. Replace with ruike-lighting-cn.conf after TLS validation.
server {
    listen 80;
    listen [::]:80;
    server_name ruikelight.cn www.ruikelight.cn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://ruikelight.com$request_uri;
    }
}
