# Brand-protection alias only. The .com website remains the unique canonical site.
server {
    listen 80;
    listen [::]:80;
    server_name ruikelight.cn www.ruikelight.cn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://ruikelight.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ruikelight.cn www.ruikelight.cn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/ruikelight.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruikelight.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 301 https://ruikelight.com$request_uri;
}
