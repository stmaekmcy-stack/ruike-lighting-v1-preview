    <title id="05-a-title">买到灯 ≠ 得到灯光效果 · 竖版 4:5</title>
    <desc id="05-a-desc">灯具只是实现效果的工具。瑞客真正交付的是：灯光在真实空间里的最终效果。 理解客户期待 → 明确效果目标 → 灯光设计 → 产品匹配 → 现场落地 → 灯光调试 → 效果验收</desc>
