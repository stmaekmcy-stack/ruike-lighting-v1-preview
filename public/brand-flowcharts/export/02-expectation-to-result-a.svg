    <title id="02-a-title">从一句期待，到真实灯光效果 · 竖版 4:5</title>
    <desc id="02-a-desc">客户买到的不是几盏灯，而是最终空间里的灯光效果。 客户表达期待 → 理解空间与使用方式 → 明确灯光效果目标 → 建立设计方案 → 确定灯具与光学参数 → 现场深化与安装 → 灯光调试 → 真实空间效果呈现</desc>
