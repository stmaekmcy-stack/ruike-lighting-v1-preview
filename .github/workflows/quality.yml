name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    env:
      VITE_DEPLOYMENT_TARGET: preview
      VITE_SITE_URL: https://stmaekmcy-stack.github.io/ruike-lighting-v1-preview/
      VITE_ALLOW_INDEXING: false
      RUIKE_RELEASE_ID: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify source and production build
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify Nginx routes on private test ports
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          sudo systemctl stop nginx
          npm run verify:nginx
